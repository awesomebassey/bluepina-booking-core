services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: bluepina
      POSTGRES_PASSWORD: bluepina
      POSTGRES_DB: bluepina
    ports:
      - "5432:5432"
    volumes:
      - bluepina_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluepina"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  bluepina_pg:
