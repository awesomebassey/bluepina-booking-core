[functions]
  directory = "apps/api/netlify/functions"
  node_bundler = "esbuild"

  included_files = [
    "node_modules/@prisma/client/package.json",
    "node_modules/@prisma/client/runtime/client.js",
    "node_modules/@prisma/client/runtime/query_compiler_fast_bg.postgresql.js",
    "node_modules/@prisma/client/runtime/query_compiler_fast_bg.postgresql.wasm-base64.js",
    "node_modules/@prisma/client-runtime-utils/package.json",
    "node_modules/@prisma/client-runtime-utils/dist/index.js"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[functions.api]
  ignored_node_modules = [
    "@nestjs/microservices",
    "@nestjs/websockets"
  ]